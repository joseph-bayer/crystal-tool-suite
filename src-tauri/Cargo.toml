[package]
name = "crystal-tool-suite"
version = "0.1.0"
description = "Installs, updates and starts the Crystal Tool Suite's tools"
authors = ["joseph-bayer"]
license = "MIT"
edition = "2021"

[lib]
name = "crystal_tool_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-dialog = "=2.8.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
tauri-plugin-updater = "=2.13.3"
# The same versions the updater uses, so they're built once.
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "json"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
futures-util = "=0.3.34"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
sha2 = "=0.10.9"
base64 = "=0.22.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_System_JobObjects",
	"Win32_System_Threading",
	"Win32_System_SystemInformation",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
	"Wdk_System_SystemServices",
] }
