name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Versions match
        run: node scripts/check-versions.mjs

      - name: Install packages
        run: npm ci

      # Also builds the page the Rust crate embeds, which clippy and the tests need.
      - name: Typecheck and build the page
        run: npm run build

      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # src-tauri/THIRD_PARTY_NOTICES.txt, which the Tauri build script needs as a bundle resource
      # (tauri build writes it itself, before building the crate).
      - name: Third-party notices
        run: npm run notices

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
