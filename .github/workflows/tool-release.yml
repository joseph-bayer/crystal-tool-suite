# A suite tool's release, for tool repos to call from their own tag workflow (see
# docs/RELEASING.md, "Releasing a suite tool"). The caller builds the tool's folder, with
# manifest.json at its root, and uploads it as an Actions artifact; this workflow checks the
# manifest against the tag, zips the folder as <id>-<version>-<platform>.zip, writes
# SHA256SUMS.txt, attaches both to a draft release on the caller's repo, and prints the release's
# entry for the suite index in the run's summary.

name: Tool release

on:
  workflow_call:
    inputs:
      artifact:
        description: The Actions artifact holding the tool's folder, manifest.json at its root.
        type: string
        required: true
      platform:
        description: The platform the folder is built for, as named in the manifest's entry and the index.
        type: string
        default: windows

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.ref_name }}
      PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: tool

      - name: Zip and checksum
        env:
          TOOL_DIR: tool
          OUT: ${{ runner.temp }}/release
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, sys, zipfile

          tool, out = os.environ["TOOL_DIR"], os.environ["OUT"]
          platform, tag = os.environ["PLATFORM"], os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          try:
              with open(os.path.join(tool, "manifest.json"), encoding="utf-8") as f:
                  manifest = json.load(f)
          except (OSError, ValueError) as e:
              fail(f"no readable manifest.json at the folder's root: {e}")

          for field in ("id", "name", "version", "entry"):
              if not manifest.get(field):
                  fail(f"manifest.json has no {field}")
          tool_id, version = manifest["id"], manifest["version"]
          if not re.fullmatch(r"[a-z0-9][a-z0-9-]*", tool_id):
              fail(f"the id {tool_id!r} isn't lowercase letters, digits and dashes")
          if not re.fullmatch(r"\d+\.\d+\.\d+([-+].*)?", version):
              fail(f"the version {version!r} isn't of the form 1.2.3")
          if tag != f"v{version}":
              fail(f"the tag {tag} isn't v{version}, the manifest's version")
          entry = manifest["entry"].get(platform) if isinstance(manifest["entry"], dict) else None
          if not entry or not entry.get("command"):
              fail(f"manifest.json's entry has no {platform} command")

          os.makedirs(out, exist_ok=True)
          name = f"{tool_id}-{version}-{platform}.zip"
          path = os.path.join(out, name)
          with zipfile.ZipFile(path, "w", zipfile.ZIP_DEFLATED) as z:
              for folder, dirs, files in os.walk(tool):
                  dirs.sort()
                  for file in sorted(files):
                      full = os.path.join(folder, file)
                      z.write(full, os.path.relpath(full, tool).replace(os.sep, "/"))

          with open(path, "rb") as f:
              sha256 = hashlib.sha256(f.read()).hexdigest()
          with open(os.path.join(out, "SHA256SUMS.txt"), "w", newline="\n") as f:
              f.write(f"{sha256}  {name}\n")

          release = {
              "version": version,
              "notesUrl": f"https://github.com/{repo}/releases/tag/{tag}",
              "downloads": {
                  platform: {
                      "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                      "sha256": sha256,
                  }
              },
          }
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          text = (
              f"## {manifest['name']} {version}\n\n"
              f"`{name}`, SHA-256 `{sha256}`.\n\n"
              "Once the draft release is published, this goes in the suite index as the tool's "
              "`latest` (its old `latest` becomes `previous`):\n\n"
              f"```json\n{json.dumps(release, indent=2)}\n```\n"
          )
          print(text)
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write(text)
          PY

      # The tag's message (git tag -a v1.2.3 -m "...") becomes the release notes.
      - name: Release notes from the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          : > "$RUNNER_TEMP/notes.md"
          if [ "${object%% *}" = tag ]; then
            gh api "repos/$GITHUB_REPOSITORY/git/tags/${object#* }" --jq .message > "$RUNNER_TEMP/notes.md"
          fi

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --draft --verify-tag \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$RUNNER_TEMP"/release/*
